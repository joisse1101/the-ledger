<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts from @joisse1101/ui-library (Figtree body, Urbanist headings, JetBrains Mono code);
         offline, the system-ui / monospace fallbacks in tokens.css take over. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Urbanist:wght@600;700;800&display=swap"
    />
    <title>The Ledger</title>
    <script>
      // Apply this device's saved theme before first paint so a dark choice doesn't
      // flash light. Without one, tokens.css follows the device's own setting.
      try {
        var saved = localStorage.getItem("ledger-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
