# jois-init:docs begin (managed by /jois-init:docs; edits here are overwritten)
name: wiki-publish

# One-way publish: wiki/ in this repo is the source, the GitHub wiki is a copy.
# Edits made in the wiki are warned about and then overwritten.
on:
  push:
    paths:
      - "wiki/**"

permissions:
  contents: write

# One run at a time, so two pushes never write the wiki together.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only the default branch publishes.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"
      - name: Warn about edits made in the wiki
        working-directory: ${{ runner.temp }}/wiki
        run: |
          bot="github-actions[bot]"
          last_bot=$(git log --author="$bot" -n 1 --format=%H || true)
          if [ -n "$last_bot" ]; then
            range="${last_bot}..HEAD"
          else
            range="HEAD"
          fi
          foreign=$(git log "$range" --perl-regexp --author='^((?!github-actions\[bot\]).*)$' --format='%h %an: %s' || true)
          if [ -n "$foreign" ]; then
            echo "::warning title=Wiki edited outside the repo::These wiki commits were not made by the publish workflow and will be overwritten: $(echo "$foreign" | tr '\n' ';')"
          fi
      - name: Mirror the output into the wiki
        run: rsync -a --delete --exclude '.git' wiki/ "$RUNNER_TEMP/wiki/"
      - name: Commit and push when something changed
        working-directory: ${{ runner.temp }}/wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The wiki already matches wiki/; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
# jois-init:docs end
